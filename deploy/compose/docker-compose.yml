# Piloto SaaS central (ADR-0005). Solo Caddy publica puertos.
# Secretos: archivo .env (nunca versionado). D-06 hosting ⛔. Keygen CE no se incluye (D-05).
name: ipvgc

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    read_only: true
    tmpfs: ["/tmp", "/run"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      API_URL: http://api:8080
      COOKIE_SECURE: "true"
      APP_BASE_URL: https://${DOMAIN:-localhost}
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/ipvgc
      DB_APP_USER: ${DB_APP_USER:-ipvgc}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-ipvgc}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
      KEYGEN_MODE: ${KEYGEN_MODE:-FAKE}
      ELTOQUE_PROVIDER_MODE: ${ELTOQUE_PROVIDER_MODE:-SEED}
      ELTOQUE_API_KEY: ${ELTOQUE_API_KEY:-}
      JWT_ACCESS_TTL_SECONDS: "900"
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipvgc
      POSTGRES_USER: ${DB_MIGRATOR_USER:-ipvgc}
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATOR_USER:-ipvgc} -d ipvgc"]
      interval: 10s
      timeout: 5s
      retries: 10
    # PostgreSQL no admite cap_drop ALL ni read_only de forma fiable.

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: service:postgres
    environment:
      PGHOST: 127.0.0.1
      PGPASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
      PGUSER: ${DB_MIGRATOR_USER:-ipvgc}
      PGDATABASE: ipvgc
    volumes:
      - backups:/backups
      - ../backup/pg_dump.sh:/usr/local/bin/pg_dump.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/pg_dump.sh || true; sleep 86400; done"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
