name: ci-android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/ci-android.yml"

jobs:
  test:
    name: android (Fase 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Sin secretos en fuentes
        run: bash android/scripts/assert-no-secrets.sh
      - name: Evaluador de licencia (JVM)
        run: gradle :core:domain:test --tests "cu.ipvgc.domain.license.*" --no-daemon --stacktrace
      - name: Unit tests + APK debug
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Cadenas prohibidas en el APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          if unzip -l "$APK" | grep -Ei 'eltoque|keygen.token|BEGIN .*PRIVATE'; then
            echo "secreto en APK" >&2
            exit 1
          fi
          echo "APK sin cadenas de proveedor"
      - name: Upload APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/
