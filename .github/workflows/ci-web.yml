name: ci-web

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  test:
    name: web (Fase 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Corte vertical BFF
        run: |
          APP_ENV=dev API_URL= MOCK_API=1 COOKIE_SECURE=false npx next start --hostname 127.0.0.1 --port 3001 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3001 >/dev/null && break; sleep 1; done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 npm run test:bff
      - name: Playwright + axe
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
