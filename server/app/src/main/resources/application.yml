spring:
  application:
    name: ipv-gestion-costos
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRATOR_USER:${DB_APP_USER:ipvgc}}
    password: ${DB_MIGRATOR_PASSWORD:${DB_APP_PASSWORD:ipvgc}}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipvgc}
    username: ${DB_APP_USER:ipvgc}
    password: ${DB_APP_PASSWORD:ipvgc}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

ipvgc:
  env: ${APP_ENV:dev}
  sync:
    stage: ${IPVGC_SYNC_STAGE:A_COUNTS}
  keygen:
    mode: ${KEYGEN_MODE:FAKE}
    webhook-secret: ${KEYGEN_WEBHOOK_SECRET:fake-webhook-secret}
  eltoque:
    mode: ${ELTOQUE_PROVIDER_MODE:SEED}
    api-url: ${ELTOQUE_API_URL:https://tasas.eltoque.com}
    api-key: ${ELTOQUE_API_KEY:}
    refresh-interval-ms: ${ELTOQUE_REFRESH_INTERVAL_MS:300000}
    fresh-window-seconds: ${ELTOQUE_FRESH_WINDOW_SECONDS:600}
    timeout-ms: ${ELTOQUE_TIMEOUT_MS:10000}
  jwt:
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh:
    pepper: ${REFRESH_TOKEN_HMAC_PEPPER:dev-only-change-me}
